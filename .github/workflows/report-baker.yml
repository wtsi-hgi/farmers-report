name: Generate and send report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 4'  # This runs at 12:00 UTC every Thursday

jobs:
  make-report:
    runs-on: [self-hosted, prod]
    container:
      image: mercury/farmers-report:latest
      volumes:
        - /opt:/opt
    strategy:
      matrix:
        bom: [ "Human Genetics", "Cellular Genetics" ]
    steps:
      - uses: actions/checkout@v3
      - name: Generate report
        run: |
          Rscript -e '
            rmarkdown::render(
              "farmers-report.Rmd",
              params = list(
                bom = "${{ matrix.bom }}",
                config_path = "/opt/farm-config.yaml",
                static = TRUE
              ),
              output_file = "/tmp/farmers-report-${{ matrix.bom }}.html"
            )
          '
      - uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ matrix.bom }}
          path: /tmp/farmers-report-${{ matrix.bom }}.html
          retention-days: 7

  send-report:
    runs-on: ubuntu-latest
    needs: make-report
    strategy:
      matrix:
        bom: [ "Human Genetics", "Cellular Genetics" ]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: html-report-${{ matrix.bom }}
          path: .
      - name: Send report
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: files.uploadV2
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
            title: "Weekly Farmers Report for ${{ matrix.bom }}"
            file: "farmers-report-${{ matrix.bom }}.html"
            filename: "farmers-report-${{ matrix.bom }}.html"
