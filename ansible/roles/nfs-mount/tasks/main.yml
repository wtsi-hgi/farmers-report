- name: Install cifs-utils
  apt:
    update_cache: yes
    name: cifs-utils
    state: present

- name: Copy smb credentials
  copy:
    src: "{{ smb_credentials }}"
    dest: "{{ smb_creds_path }}"

- name: Make systemd unit for nfs mount
  template:
    src: nfs.mount.j2
    dest: /etc/systemd/system/nfs.mount
  notify:
    - Reload systemd
    - Restart nfs-mount

- name: Enable nfs-mount service
  systemd:
    name: nfs.mount
    enabled: yes
    state: started